# Colours mirror ui/_theme.py, which is the source of truth and carries the
# validator results. Streamlit's own chrome reads these; the console's own
# marks read the palette directly so both stay in step.

[theme]
base = "light"
primaryColor = "#d75a07"
backgroundColor = "#eef6f3"
secondaryBackgroundColor = "#e4efeb"
textColor = "#07252a"

# base belongs to [theme] only; Streamlit rejects theme.dark.base and logs a
# warning on every boot. The section itself is what selects the dark values.
[theme.dark]
primaryColor = "#ea630c"
backgroundColor = "#0c1f24"
secondaryBackgroundColor = "#071418"
textColor = "#eaf3f1"
